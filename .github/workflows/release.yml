name: Build and publish installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motore-ocr-installer-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime and batch scripts
        shell: pwsh
        run: |
          node --check src/runtime-server.mjs
          cmd /d /c "call src\Avvia-OCR-Runtime.cmd >nul 2>&1 & exit /b 0"
          findstr /C:"winget install llama.cpp" src\Configure-Local-AI.cmd
          findstr /C:"taskkill /PID" src\Configure-Local-AI.cmd
          findstr /C:"runtimeVersion" src\Configure-Local-AI.cmd
          if (Select-String -Path src\Configure-Local-AI.cmd -Pattern "Ollama.Ollama|npm install -g opencode" -Quiet) { throw "Legacy Ollama/OpenCode installers must not be packaged." }
          findstr /C:"qwen2.5-0.5b-instruct-q4_k_m.gguf" src\Configure-Local-AI.cmd
          if (Test-Path src\Install-Dependencies.ps1) { throw "Legacy PowerShell bootstrap must not be packaged." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Motore-OCR-Local-Setup.iss
          Get-FileHash dist\Motore-OCR-Local-Setup.exe -Algorithm SHA256 | ForEach-Object { $_.Hash + "  Motore-OCR-Local-Setup.exe" } | Set-Content dist\SHA256.txt

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-ai-latest --cleanup-tag -y 2>$null
          gh release create local-ai-latest dist\Motore-OCR-Local-Setup.exe dist\SHA256.txt --title "Motore OCR AI Locale 0.1.6" --notes "Installer Windows ultra-leggero: avanzamento per fasi e barra reale durante il download del modello; llama.cpp + Qwen2.5 0.5B GGUF." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Motore-OCR-Local-Setup-0.1.6
          path: dist/*
